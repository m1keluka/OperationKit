<!DOCTYPE html>
<html lang="en" class="h-full bg-surface" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F0E8" />
    <!-- Replaced server-side with the install's own favicon + name (routes/branding.ts renderBrandedIndex). -->
    <link rel="icon" href="/api/branding/favicon" />
    <title>Operation Kit</title>
    <!--
      App-shell skeleton (obj 700585). This inline critical CSS + markup paints an
      instant board skeleton on the very first frame — before the JS bundle
      downloads, parses, and mounts React. It is the pragmatic "pre-render" that
      delivers the perceived-load win people reach SSR for, at near-zero cost:
      createRoot(#root).render() clears #root on mount, so this skeleton is
      replaced by the real app the moment React takes over. Colours are the shipped
      design tokens (surface/line/fg/accent) hard-coded here because index.html has
      no Tailwind runtime; they mirror tailwind.config.ts exactly.
    -->
    <style>
      /* Colors mirror the OK v1.0 LIGHT defaults (index.css / tailwind.config.ts)
         hard-coded here because this paints before Tailwind/CSS vars are ready. */
      #app-shell { height: 100%; display: flex; flex-direction: column; background: #F3F0E8; }
      #app-shell * { box-sizing: border-box; }
      .as-topbar {
        height: 48px; flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
        padding: 0 16px; border-bottom: 1px solid #DCD6C8; background: #F3F0E8;
      }
      /* Neutral logo placeholder — never a brand glyph (white-label, obj 900543). */
      .as-mark {
        width: 28px; height: 28px; border-radius: 6px; background: #E5E1D5; flex: 0 0 auto;
      }
      .as-pill { height: 12px; border-radius: 4px; background: #E5E1D5; }
      .as-board {
        flex: 1 1 auto; display: flex; gap: 12px; padding: 16px;
        overflow: hidden; align-items: flex-start;
      }
      .as-col {
        flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px;
      }
      .as-colhead {
        height: 11px; width: 82px; border-radius: 3px; background: #E5E1D5; margin-bottom: 4px;
      }
      .as-card {
        display: flex; gap: 10px; padding: 11px; border-radius: 6px;
        border: 1px solid #DCD6C8; background: #FBF9F4;
      }
      .as-tile { width: 26px; height: 26px; border-radius: 4px; background: #E5E1D5; flex: 0 0 auto; }
      .as-lines { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
      .as-line { height: 11px; border-radius: 3px; background: #E5E1D5; }
      .as-shimmer {
        position: relative; overflow: hidden;
        background: linear-gradient(90deg, #E5E1D5 0%, #DCD6C8 50%, #E5E1D5 100%);
        background-size: 200% 100%; animation: as-pulse 1.4s ease-in-out infinite;
      }
      @keyframes as-pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .as-shimmer { animation: none; } }
      /* Mobile mirrors the real board: a single full-width column, not a cramped grid. */
      @media (max-width: 640px) { .as-board > .as-col:nth-child(n+2) { display: none; } }
      /* Dark-theme skeleton (localStorage 'ok-theme'='dark', read inline below). */
      html[data-theme="dark"] #app-shell { background: #16163A; }
      html[data-theme="dark"] .as-topbar { background: #16163A; border-bottom-color: #393C62; }
      html[data-theme="dark"] .as-mark { background: #292B53; }
      html[data-theme="dark"] .as-pill,
      html[data-theme="dark"] .as-colhead,
      html[data-theme="dark"] .as-tile,
      html[data-theme="dark"] .as-line { background: #292B53; }
      html[data-theme="dark"] .as-card { background: #202148; border-color: #393C62; }
      html[data-theme="dark"] .as-shimmer { background: linear-gradient(90deg, #292B53 0%, #393C62 50%, #292B53 100%); background-size: 200% 100%; }
      @media (prefers-color-scheme: dark) {
        html[data-theme="auto"] #app-shell { background: #16163A; }
        html[data-theme="auto"] .as-topbar { background: #16163A; border-bottom-color: #393C62; }
        html[data-theme="auto"] .as-mark { background: #292B53; }
        html[data-theme="auto"] .as-pill,
        html[data-theme="auto"] .as-colhead,
        html[data-theme="auto"] .as-tile,
        html[data-theme="auto"] .as-line { background: #292B53; }
        html[data-theme="auto"] .as-card { background: #202148; border-color: #393C62; }
      }
    </style>
    <script>
      // Read the theme choice before first paint so the skeleton above doesn't flash
      // the wrong mode (main.tsx re-applies this on every load; kept in sync here).
      // Mirrors lib/theme.ts: explicit choice, else the OS preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem('ok-theme') || localStorage.getItem('cc.preview.theme.v2'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16163A');
      })();
    </script>
  </head>
  <body class="h-full text-fg-0">
    <div id="root" class="h-full">
      <!-- Instant app shell — swapped out when React mounts (obj 700585). -->
      <div id="app-shell" aria-hidden="true">
        <div class="as-topbar">
          <div class="as-mark"></div>
          <div class="as-pill as-shimmer" style="width:56px"></div>
          <div class="as-pill as-shimmer" style="width:52px"></div>
          <div class="as-pill as-shimmer" style="width:48px"></div>
          <div class="as-pill as-shimmer" style="width:60px;margin-left:auto"></div>
        </div>
        <div class="as-board">
          <div class="as-col">
            <div class="as-colhead as-shimmer"></div>
            <div class="as-card"><div class="as-tile as-shimmer"></div><div class="as-lines"><div class="as-line as-shimmer" style="width:72%"></div><div class="as-line as-shimmer"></div><div class="as-line as-shimmer" style="width:40%"></div></div></div>
            <div class="as-card"><div class="as-tile as-shimmer"></div><div class="as-lines"><div class="as-line as-shimmer" style="width:60%"></div><div class="as-line as-shimmer"></div><div class="as-line as-shimmer" style="width:44%"></div></div></div>
            <div class="as-card"><div class="as-tile as-shimmer"></div><div class="as-lines"><div class="as-line as-shimmer" style="width:80%"></div><div class="as-line as-shimmer" style="width:52%"></div></div></div>
          </div>
          <div class="as-col">
            <div class="as-colhead as-shimmer"></div>
            <div class="as-card"><div class="as-tile as-shimmer"></div><div class="as-lines"><div class="as-line as-shimmer" style="width:66%"></div><div class="as-line as-shimmer"></div><div class="as-line as-shimmer" style="width:38%"></div></div></div>
            <div class="as-card"><div class="as-tile as-shimmer"></div><div class="as-lines"><div class="as-line as-shimmer" style="width:74%"></div><div class="as-line as-shimmer" style="width:48%"></div></div></div>
          </div>
          <div class="as-col">
            <div class="as-colhead as-shimmer"></div>
            <div class="as-card"><div class="as-tile as-shimmer"></div><div class="as-lines"><div class="as-line as-shimmer" style="width:70%"></div><div class="as-line as-shimmer" style="width:42%"></div></div></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
