# install/api-bypass-paths.conf — the ONE list of API routes that Cloudflare
# Access lets through WITHOUT its sign-in page, because Operation Kit's own API
# key is the lock on them.
#
# Why this exists: a standard install puts Cloudflare Access in front of the
# WHOLE site. A bot that calls the board API with its `cc_live_` key gets
# Cloudflare's HTML sign-in page instead of an answer — its key is never even
# looked at. The routes below are the bot-facing ones, so Cloudflare is told to
# step aside for them and let the app check the key itself. Everything not
# listed here stays behind the Cloudflare sign-in.
#
# Format — one route per line, "<mode> <path>":
#   prefix <path>   the path itself AND everything under it (<path> and <path>/*)
#   exact  <path>   only that exact path
# Blank lines and lines starting with # are ignored.
#
# TO ADD A ROUTE a bot needs:
#   1. add one line below (keep it as narrow as it can be — `exact` if the bot
#      only calls one address),
#   2. re-run the step on the server:
#        sudo bash /opt/operationkit-src/install/cloudflare.sh api-bypass \
#          --config /opt/operationkit-src/client.conf
#      (it updates the existing Access app in place — it never makes a second one),
#   3. re-run install/verify.sh.
#
# WHAT YOU MAY NOT ADD. install/api-bypass-lib.sh REFUSES these and the whole
# step stops rather than opening them (install/test/api-bypass-paths-test.sh
# proves it):
#   /api itself, or any blanket wildcard  ·  /api/internal  ·  /api/admin
#   /api/secrets  ·  /api/secret-upload   ·  /api/webhooks  ·  /api/public
#   /api/llm (incl. /api/llm/v1)  ·  /api/alerts  ·  /api/costs  ·  /api/intel
#   /api/status  ·  /api/auth/* — with ONE exception, the exact /api/auth/me,
#   which only answers "who am I" for a caller that already has a valid key.
# These are the operator surface. They must keep two locks, not one.

# ── Bots and AI tools ────────────────────────────────────────────────────────
prefix /api/mcp
prefix /api/agent
prefix /api/agents
prefix /api/agent-chat/agents

# ── The board ────────────────────────────────────────────────────────────────
prefix /api/objectives
prefix /api/projects
prefix /api/workspaces
prefix /api/feed
prefix /api/briefing

# ── Knowledge base and files ─────────────────────────────────────────────────
prefix /api/docs
prefix /api/kb-wiki
prefix /api/files

# ── Supporting reads ─────────────────────────────────────────────────────────
prefix /api/models

# ── Single addresses ─────────────────────────────────────────────────────────
exact /api/health
exact /api/openapi.json
exact /api/auth/me
