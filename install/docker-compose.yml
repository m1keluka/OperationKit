# ==============================================================================
# Operation Kit — client install stack (used by ./install.sh, never edited by hand)
# ------------------------------------------------------------------------------
# Every host path comes from INSTALL_DIR in the client config (default
# /opt/operationkit) via install.env, written by install.sh. Nothing here names a
# person or a specific server. The repo-root docker-compose.yml is the upstream
# operator's own development layout and is NOT used for client installs.
#
#   $OK_STATE/data  -> /app/data        database, uploads, branding, logs
#   $OK_STATE/home  -> $OK_APP_HOME     the app user's home (projects, notes, memory)
#   $OK_STATE/tmp   -> /tmp             session worktrees + sandbox homes; mapped
#                                       back to host paths for the sandbox via
#                                       SESSION_JAIL_HOST_PATH_MAP
#
# Network: the app is published on two PRIVATE addresses, never 0.0.0.0:
#   127.0.0.1:3002           install/verify.sh and scripts on the server
#   <docker0 gateway>:3002   containers on the default Docker bridge, e.g.
#                            http://172.17.0.1:3002 from a card sandbox (obj 900185)
# install.sh writes OK_DOCKER_BRIDGE_IP (docker0's IPv4; DOCKER_BRIDGE_IP in
# client.conf overrides) and opens 3002 in ufw ONLY for traffic arriving on
# docker0. The docker0 address is not routable from the internet. The public way
# in is the cloudflared connector below, which dials OUT to Cloudflare — the
# firewall keeps 80/443 (and 3002) closed on the public NIC.
#
# Sandboxes (obj 900113): per-session sandbox containers join the `ok-jails`
# bridge, which only the app container shares. Each sandbox forwards its own
# localhost:3002 to command-center:3002 over it, so the ~60 prompt/script call
# sites that say "curl localhost:3002" (AI review criteria, pr-created, ...)
# reach the app. The app treats that subnet as on-box (INTERNAL_TRUSTED_PEER_CIDRS).
# ==============================================================================
name: operationkit

services:
  command-center:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        # The commit being installed (install.sh writes it to install.env).
        GIT_SHA: ${OK_GIT_SHA:-unknown}
    image: operationkit-app:local
    # Server code and scripts address the app container by this name.
    container_name: command-center
    command: ["bash", "/app/entrypoint.sh"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3002:3002"
      # Default Docker bridge gateway (obj 900185) — see header. Private, not public.
      - "${OK_DOCKER_BRIDGE_IP:-172.17.0.1}:3002:3002"
    networks:
      - default
      - jails
    volumes:
      - ${OK_STATE:?run ./install.sh}/data:/app/data
      - ${OK_STATE}/home:${OK_APP_HOME:?run ./install.sh}
      - ${OK_STATE}/tmp:/tmp
      # Needed ONLY to start the per-session sandbox containers. Sessions never
      # see this socket: each sandbox mounts just its own work folder + home.
      - /var/run/docker.sock:/var/run/docker.sock
      # D2 (obj 900540): the secrets-store key-encryption key, read-only, app only.
      # Root-owned mode 400 on the host (install/lib.sh kek_file_ensure). Session
      # sandboxes mount only their own work folder + home, so they never see it.
      - ${OK_KEK_FILE:?run ./install.sh}:/run/secrets/operationkit-secrets-kek:ro
    environment:
      NODE_ENV: production
      PORT: "3002"
      TZ: ${OK_TIMEZONE:-UTC}
      JWT_SECRET: ${CC_JWT_SECRET:?missing — run ./install.sh}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?missing — run ./install.sh}
      # D2: the KEK comes from the read-only file above, NOT from an env var, so it
      # cannot leak through a child process environment.
      SECRETS_KEK_PROVIDER: host-file
      SECRETS_KEK_FILE: /run/secrets/operationkit-secrets-kek
      TEST_CRED_ENCRYPTION_KEY: ${TEST_CRED_ENCRYPTION_KEY:?missing — run ./install.sh}
      CORS_ORIGINS: https://${OK_DOMAIN}
      OK_BRAND_NAME: ${OK_BRAND_NAME:-OperationKit}
      # The operator's own background jobs; nothing to run on a client install.
      HOST_BOOT_DAEMONS_ENABLED: "false"
      # Image-based install: no live checkout, so the drift guard has nothing to watch.
      DRIFT_GUARD: "off"
      # Per-session sandbox (app/server/src/services/session-jail.ts).
      SESSION_ISOLATION: ${OK_SESSION_ISOLATION:-docker}
      SESSION_JAIL_IMAGE: ok-jail:local
      # Sandbox /tmp tmpfs size (obj 900402; was a hardcoded 256m) and optional
      # CLAUDE_CODE_TMPDIR on the disk-backed sandbox HOME. Replaces the OVH docker shim.
      SESSION_JAIL_TMP_SIZE: ${OK_JAIL_TMP_SIZE:-2g}
      SESSION_JAIL_CLAUDE_TMPDIR: ${OK_JAIL_CLAUDE_TMPDIR:-}
      SESSION_JAIL_HOST_PATH_MAP: /tmp=${OK_STATE}/tmp,/app/data=${OK_STATE}/data,${OK_APP_HOME}=${OK_STATE}/home
      # Sandboxes reach this app over the ok-jails network (see header, obj 900113).
      SESSION_JAIL_NETWORK: ok-jails
      SESSION_JAIL_CC_UPSTREAM: command-center:3002
      INTERNAL_TRUSTED_PEER_CIDRS: ${OK_JAIL_SUBNET:-172.30.250.0/24}
      # How sandboxed sessions sign in to Claude (sandbox-claude-auth.ts). One of
      # the two is set by install/claude-login.sh; both empty = sessions queue.
      SESSION_JAIL_CLAUDE_OAUTH_TOKEN: ${SESSION_JAIL_CLAUDE_OAUTH_TOKEN:-}
      SESSION_JAIL_ANTHROPIC_API_KEY: ${SESSION_JAIL_ANTHROPIC_API_KEY:-}
      # One login (obj 720332): set by install/cloudflare.sh. Both present = the app
      # verifies Cloudflare Access's signed identity header and skips its own
      # sign-in page. Empty (--skip-cloudflare) = password sign-in only.
      OK_CF_ACCESS_TEAM: ${OK_CF_ACCESS_TEAM:-}
      OK_CF_ACCESS_AUD: ${OK_CF_ACCESS_AUD:-}
      # Card browser lockdown (obj 900024; app/server/src/lib/browser-policy.ts).
      # Defaults here are the LOCKED-DOWN ones: sandbox on, egress guard on,
      # no private network, no cloud metadata. install.sh writes the OK_BROWSER_*
      # values from client.conf; an unset variable keeps the safe default.
      CARD_BROWSER_SANDBOX: ${OK_BROWSER_SANDBOX:-on}
      CARD_BROWSER_EGRESS_GUARD: ${OK_BROWSER_EGRESS_GUARD:-on}
      CARD_BROWSER_ALLOWED_ORIGINS: ${OK_BROWSER_ALLOWED_ORIGINS:-}
      CARD_BROWSER_BLOCKED_ORIGINS: ${OK_BROWSER_BLOCKED_ORIGINS:-}
      CARD_BROWSER_ALLOW_LOOPBACK: ${OK_BROWSER_ALLOW_LOOPBACK:-on}
      CARD_BROWSER_ALLOW_PRIVATE_NETWORK: ${OK_BROWSER_ALLOW_PRIVATE_NETWORK:-off}
      CARD_BROWSER_ALLOW_METADATA: "off"
      OK_DOMAIN: ${OK_DOMAIN:-localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - command-center
    # Started only when Cloudflare is set up (install.sh enables the profile).
    profiles: ["tunnel"]

networks:
  # Shared ONLY by the app container and the per-session sandboxes (obj 900113).
  # Fixed name: the app passes it to `docker run --network` for each sandbox.
  # Fixed subnet: the app trusts exactly this range as on-box callers.
  jails:
    name: ok-jails
    driver: bridge
    ipam:
      config:
        - subnet: ${OK_JAIL_SUBNET:-172.30.250.0/24}
