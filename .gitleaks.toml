# .gitleaks.toml — false positive allowlist for the OSS publish gate.
#
# Gitleaks scans the assembled tree (post-strip) before genericization.
# These patterns are test fixtures, documentation examples, or
# deliberately redacted placeholders — not real secrets.
#
# NOTE: gitleaks 8.18+ uses [[allowlists]] (array of tables), not [allowlist].
# The old [allowlist] format is silently ignored by modern gitleaks.

# === Test files allowlist ===
# Test files can contain fake secrets by design.
[[allowlists]]
description = "test files — fake secrets allowed"
paths = [
    '''.*\.test\.ts$''',
    '''.*\.test\.js$''',
    '''.*\.spec\.ts$''',
    '''.*\.spec\.js$''',
]

# === .env.example allowlist ===
# Environment example files contain placeholder patterns, not real secrets.
[[allowlists]]
description = "environment example files"
paths = [
    '''\.env\.example$''',
    '''\.env\.sample$''',
]

# === Test fixture fake API keys ===
# These literal strings appear in test fixtures and documentation.
[[allowlists]]
description = "test fixture fake API keys"
regexTarget = "match"
regexes = [
    '''sk-secret''',
    '''sk-global''',
    '''sk-plaintext-value''',
    '''sk-live-abcdef\d+''',
]
