# DB-state ground-truth invariants — surface-independent claims the oracle asserts
# directly against real SQLite. The cheapest unbeatable checks.
invariants:
  - id: INV-1
    priority: P0
    claim: "every objectives.status in {planning,queue,working,ai_review,review,done}"
    oracle_check: db-invariant/objective-status
  - id: INV-2
    priority: P0
    claim: "session_intel.session_id is unique (no double-extraction)"
    oracle_check: db-invariant/session-uniqueness
  - id: INV-3
    priority: P1
    claim: "no objectives.parent_id pointing at a missing row (no orphan)"
  - id: INV-4
    priority: P1
    claim: "no objective in 'working' with session_count=0 beyond the grace window"
  - id: INV-5
    priority: P1
    claim: "ai_review_iteration <= 3 (review cap honored)"
  - id: INV-6
    priority: P2
    claim: "every objective_prs.state in {open,merged,closed}"

# First AaU1000 ideation targets — the untested cells, ordered by value. Mirrors the
# Phase-0 SHADOW ideate seed in services/kitchen-loop.ts (computeIdeateTickets).
coverage_gaps:
  - { rank: 1, feature: F5, tier: T1, priority: P0, note: "end-to-end transition over real HTTP → DB row + spawn (L4, highest value)" }
  - { rank: 2, feature: F6, tier: T1, priority: P0, note: "spawn ground truth: tmux + worktree + session_id" }
  - { rank: 3, feature: F1, tier: T1, priority: P0, note: "auth contract: cookie set, /me round-trip, bad creds 401" }
  - { rank: 4, feature: F9, tier: T1, priority: P0, note: "ai_review gate: reviewer spawn + cap=3 + verdict shape" }
  - { rank: 5, feature: INV-3/INV-4, tier: T2, priority: P1, note: "orphan & stuck-spawn invariants → add to QUICK" }
  - { rank: 6, feature: F16, tier: T2, priority: P1, note: "WebSocket reconnect: board delta after backend restart" }
  - { rank: 7, feature: F13, tier: T2, priority: P1, note: "routines run-now instantiates an objective" }
  - { rank: 8, feature: F18/F19, tier: T3, priority: P2, note: "deploy refuses on dirty-served tree" }
  - { rank: 9, feature: F20, tier: T3, priority: P2, note: "auto-merge dry-run logs WOULD-merge while OFF" }
