name: Secret scan

# Blocks any PR (and pushes to main) that introduces a live credential.
# Uses gitleaks with the repo's .gitleaks.toml. Runs on GitHub-hosted runners
# (no droplet dependency), so it protects the public repo for outside
# contributors from day one.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action@v2 posts a PR comment when it finds leaks on pull_request
  # events; without write access it fails with "Resource not accessible by
  # integration" before completing the scan.
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # fetch-depth 0 so gitleaks can scan the full history range on push,
          # and the PR commit range on pull_request.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required by gitleaks-action@v2 to scan pull_request events (it uses
          # the token to enumerate the PR commit range). Without it, PR runs
          # error: "GITHUB_TOKEN is now required to scan pull requests".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pin gitleaks >= 8.19. REQUIRED: .gitleaks.toml uses the plural
          # `[[allowlists]]` schema, which only exists in gitleaks 8.19+.
          # gitleaks-action@v2's default binary (8.18.x) silently IGNORES every
          # allowlist in that file, producing false positives on test fixtures
          # (generic-api-key / generic-password-assignment in *.test.ts). Pinning
          # a modern version makes the config's allowlists apply as authored.
          GITLEAKS_VERSION: "8.28.0"
          # No org license needed for public repos; this action is free for OSS.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
