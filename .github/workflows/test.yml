name: test

# First CI gate for command-center-infra: runs the existing Vitest suites
# (server = node env, client = jsdom env) on every PR to the default branch.
# No *executed* Playwright/e2e here — those stay CLI + human-in-the-loop. Committed
# UI evidence under tests/smoke/ is browsable artifacts, never run by CI (see tests/smoke/README.md).

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: vitest (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    # Server suite includes integration tests that spawn subprocesses (tsc, etc.).
    # It completes well under 5 min once hermetic; 12 min is a generous backstop
    # that still fails fast on a future synchronous hang (which vitest's
    # testTimeout cannot interrupt) instead of pinning the runner for 20 min.
    timeout-minutes: 12
    strategy:
      # Run both suites even if one fails, so a failure in one is not masked.
      fail-fast: false
      matrix:
        workspace: [server, client]
    defaults:
      run:
        # npm workspaces are rooted at app/ (app/package.json declares them).
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # app/package-lock.json IS committed, so use `npm ci` — CI then resolves
      # the exact tree production does, and a drifted lockfile fails loudly
      # instead of being silently reconciled. (This comment previously claimed
      # the lockfile was gitignored; that has not been true since it was
      # committed, and gate.yml has used `npm ci` all along.) `--include=dev` is
      # explicit because vitest/jsdom/@vitejs-plugin-react are devDependencies
      # and would be skipped if a NODE_ENV=production leaked into the runner env.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Vitest (${{ matrix.workspace }})
        run: npm run test --workspace=${{ matrix.workspace }}
