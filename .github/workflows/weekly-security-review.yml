name: Weekly cross-repo security review

# Phase 3 of the DeepSec adoption memo. ONE workflow, hosted in the ops-hub repo
# (command-center-infra), that runs a deep security review across ALL 5 canonical
# repos every Sunday and aggregates the findings into one vault digest + (for
# high/critical only) one Command Center board objective.
#
# WHY SELF-HOSTED: the digest is written to /home/operator/second-brain/... and the
# board objective is created via POST http://localhost:3002/api/internal/objectives
# — both are droplet-local. A GitHub-hosted runner can reach NEITHER, so this
# workflow targets a self-hosted runner registered on the droplet. Registering
# that runner + setting the secrets below + un-commenting the schedule are the
# three enable-time steps documented in the runbook
# (~/second-brain/workspaces/personal/security/weekly-security-review-runbook.md).
#
# READY-TO-ENABLE, NOT ENABLED: the weekly schedule is intentionally left
# COMMENTED OUT so merging this PR does not silently start a recurring, board-
# writing, token-spending job. Mike enables it by un-commenting the `schedule:`
# block. Until then the workflow only runs on manual workflow_dispatch.

on:
  # ↓↓↓ ENABLE-TIME: un-comment to activate the Sunday cron (see runbook). ↓↓↓
  # schedule:
  #   - cron: '17 8 * * 0'   # Sundays 08:17 UTC = 00:17 PST / 01:17 PDT, off-hours
  workflow_dispatch:
    inputs:
      only:
        description: 'Scan a single repo (slug, e.g. example-platform). Blank = all 5.'
        required: false
        default: ''
      dry_run:
        description: 'true = do everything EXCEPT create the board objective'
        required: false
        default: 'false'

# One weekly review at a time; never cancel a run in progress.
concurrency:
  group: weekly-security-review
  cancel-in-progress: false

jobs:
  review:
    # Self-hosted runner on the droplet (see WHY SELF-HOSTED above). Only run the
    # scheduled review from the canonical repo/branch so a fork/mirror can't
    # double-write the digest + board.
    runs-on: [self-hosted, linux]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && github.repository == 'your-org/command-center-infra')
    timeout-minutes: 90
    steps:
      - name: Checkout (for the orchestration script)
        uses: actions/checkout@v4

      - name: Ensure scanners are installed
        run: |
          set -euo pipefail
          # TruffleHog OSS (git-history secret sweep) — pin to a released binary.
          if ! command -v trufflehog >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
              | sh -s -- -b "$HOME/.local/bin"
          fi
          # Claude Code CLI (headless /security-review). Installed globally on the
          # droplet already; install on demand if the runner image lacks it.
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run cross-repo weekly security review
        env:
          # ── Auth for scanner (a): Claude /security-review ──────────────────
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ── gh clone of the 5 repos (read scope across the 3 owners) ───────
          GH_TOKEN: ${{ secrets.SECURITY_REVIEW_GH_TOKEN }}
          # ── Droplet-local targets (defaults baked into the script) ─────────
          SECOND_BRAIN_ROOT: /home/operator/second-brain
          CC_API: http://localhost:3002
          # ── Per-repo Supabase anon-key RLS probe creds (scanner c) ─────────
          # Probe self-skips for any repo whose pair is unset.
          CC_PLATFORM_SUPABASE_URL: ${{ secrets.CC_PLATFORM_SUPABASE_URL }}
          CC_PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.CC_PLATFORM_SUPABASE_ANON_KEY }}
          COMMAND_CENTER_INFRA_SUPABASE_URL: ${{ secrets.COMMAND_CENTER_INFRA_SUPABASE_URL }}
          COMMAND_CENTER_INFRA_SUPABASE_ANON_KEY: ${{ secrets.COMMAND_CENTER_INFRA_SUPABASE_ANON_KEY }}
          EXAMPLE3_PLATFORM_SUPABASE_URL: ${{ secrets.EXAMPLE3_PLATFORM_SUPABASE_URL }}
          EXAMPLE3_PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.EXAMPLE3_PLATFORM_SUPABASE_ANON_KEY }}
          WEIGHT_SUPPLY_PLATFORM_SUPABASE_URL: ${{ secrets.WEIGHT_SUPPLY_PLATFORM_SUPABASE_URL }}
          WEIGHT_SUPPLY_PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.WEIGHT_SUPPLY_PLATFORM_SUPABASE_ANON_KEY }}
          CONTENT_ENGINE_SUPABASE_URL: ${{ secrets.CONTENT_ENGINE_SUPABASE_URL }}
          CONTENT_ENGINE_SUPABASE_ANON_KEY: ${{ secrets.CONTENT_ENGINE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          export WORKDIR="$RUNNER_TEMP/sec-review"
          bash scripts/security/weekly-security-review.sh $ARGS

      - name: Upload raw scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-raw
          path: ${{ runner.temp }}/sec-review/findings/
          if-no-files-found: warn
          retention-days: 30
